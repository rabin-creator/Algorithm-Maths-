<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Mode</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
            transition: 0.3s;
        }

        .dark {
            background-color: #111;
            color: white;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>DOM Dark Mode</h1>

    <p>Click the button to change the theme.</p>

    <button id="darkBtn">Dark Mode</button>

    <script>
        let button = document.getElementById("darkBtn");

        button.addEventListener("click", function() {
            document.body.classList.toggle("dark");
        });
    </script>

</body>
</html>
